<!DOCTYPE html>
<html>
<head>
    <title>In-Page Navigation</title>
    <style>
        body {
            background-color: #faf5ff;
            color: #3b0764;
            margin: 24px;
        }
        h1 {
            color: #581c87;
        }
        .container {
            background-color: #ffffff;
            border-width: 1px;
            border-color: #e9d5ff;
            padding: 20px;
        }
        .btn {
            background-color: #7e22ce;
            color: #ffffff;
            padding: 8px 16px;
            margin: 12px 0;
            border-width: 1px;
            border-color: #6b21a8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Page Navigation Complete</h1>
        <p>The previous document was cleanly deallocated, new HTML parsed into a fresh DOM tree, styles re-cascaded, and layout reflowed.</p>
        <p>Current URL has been updated in the browser window state.</p>
        <div>
            <a class="btn" href="examples/demo.html">Back to Main Demo</a>
        </div>
    </div>
</body>
</html>
